name: gold_gym_fe_android
description: Gold Gym POS & Inventory Management - Flutter Android
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0

  # State Management
  provider: ^6.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  # JWT Decoding
  jwt_decoder: ^2.0.1

  # Date & Time Formatting
  intl: ^0.19.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Toast/Snackbar
  fluttertoast: ^8.2.4

  # Image Carousel
  carousel_slider: ^5.1.2

  # SVG Support
  flutter_svg: ^2.0.10

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/banners/
    - .env.local
    - .env.production
