name: gold_gym_fe_android
description: Gold Gym POS & Inventory Management - Flutter Android
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.0

  # State Management
  provider: ^6.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  # JWT Decoding
  jwt_decoder: ^2.0.1

  # Date & Time Formatting
  intl: ^0.19.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Toast/Snackbar
  fluttertoast: ^8.2.4

  # Image Carousel
  carousel_slider: ^5.1.2

  # SVG Support
  flutter_svg: ^2.0.10

  # Icons
  cupertino_icons: ^1.0.6

  flutter_typeahead: ^5.2.0

  # PDF Printing (nota)
  printing: ^5.12.0

  # Pilih foto bukti pembayaran (kamera/galeri)
  image_picker: ^1.1.2

  # Simpan foto bukti pembayaran ke galeri (download dari Sales History)
  gal: ^2.3.0

  # Deep-link ke WhatsApp (wa.me) dari layar Bagikan Struk
  url_launcher: ^6.3.1

  # Share sheet Android generik (PDF nota terlampir) di layar Bagikan Struk
  share_plus: ^10.1.4

  # Direktori sementara untuk tulis PDF sebelum dibagikan (supaya nama file
  # yang muncul di aplikasi tujuan rapi, mis. "nota-TRX123.pdf")
  path_provider: ^2.1.4

  # Cek & minta aktifkan Bluetooth sebelum Cetak Struk (adapter-state saja,
  # BUKAN untuk scan/pairing raw print -- printer tetap dipilih lewat dialog
  # print native Android seperti sekarang, via package printing di atas)
  flutter_blue_plus: ^1.35.3

  # Simpan PDF struk ke penyimpanan lokal ("Unduh Struk") -- aman lintas
  # Android API level (scoped storage API 29+, fallback di bawahnya)
  file_saver: ^0.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/banners/
    - .env.local
    - .env.production
